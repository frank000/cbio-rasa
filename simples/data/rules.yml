version: "3.1"

rules:

- rule: Say goodbye anytime the user says goodbye
  steps:
  - intent: goodbye
  - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
  - intent: bot_challenge
  - action: utter_iamabot

- rule: Executar lembrete de finalização
  steps:
  - intent: EXTERNAL_finalizacao
  - action: ac_remind_finalizacao

- rule: Acção de comprimentar
  steps:
  - intent: greet
  - action: utter_greets
